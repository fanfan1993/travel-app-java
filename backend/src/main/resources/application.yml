server:
  port: 8080

spring:
  application:
    name: pink-travel-backend

  # ===== MySQL 8（默认）=====
  # 数据库不存在时会自动创建（createDatabaseIfNotExist=true），首次启动即可用
  datasource:
    url: jdbc:mysql://localhost:3306/pink_travel?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 演示用：自动建表/更新表结构。生产建议改为 none + Flyway/Liquibase
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# ===== AI 助手（阿里云百炼 OpenAI 兼容接口）=====
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: ${AI_MODEL:qwen-plus}

logging:
  level:
    com.pinktravel: info
